<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume, un navigateur léger pour Windows</title>
<meta name="description" content="Un navigateur léger pour Windows : YouTube sans publicité, les lives Twitch sans pub si vous le voulez, des onglets qui s'endorment, et rien qui ne quitte votre machine.">
<link rel="icon" href="plume.ico">
<meta property="og:title" content="Plume">
<meta property="og:description" content="Un navigateur léger pour Windows : YouTube sans publicité, les lives Twitch sans pub si vous le voulez, et rien qui ne quitte votre machine.">
<meta property="og:image" content="gestionnaire-des-taches.png">
<style>
/* Les couleurs sont celles de l'application, reprises de interface.py : le
   site doit ressembler a Plume, pas a une page qui parle de Plume. */
:root {
  --onglets: #1c1b22;
  --nav: #2b2a33;
  --page: #12131a;
  --champ: #1c1b22;
  --bord: #3a3944;
  --survol: #35343f;
  --onglet-actif: #40395c;
  --texte: #fbfbfe;
  --texte2: #b1b1bd;
  --texte3: #7a7988;
  --accent: #7c5cff;
  --accent-pale: #a78bfa;
  --bleu: #a7c7ff; --vert: #a7e8be; --ambre: #f7cd96;
  --rose: #f0b4cd; --violet: #cdbafa; --turquoise: #a3e0e6;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 96px; }
body {
  margin: 0; background: var(--page); color: var(--texte);
  font: 16px/1.6 "Segoe UI", -apple-system, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent-pale); }

/* --- L'intro, la meme que celle du navigateur au lancement --------------- */
#intro {
  position: fixed; inset: 0; z-index: 100; width: 100%; height: 100%;
  display: block; background: #12131a; cursor: pointer;
}
#intro.partie { opacity: 0; pointer-events: none; transition: opacity .28s; }
#page { opacity: 0; transition: opacity .5s ease-out; }
#page.visible { opacity: 1; }
body.attend { overflow: hidden; }

/* --- La fenetre de Plume : onglets et barre d'adresse ------------------- */
.chrome { position: sticky; top: 0; z-index: 20; }
.onglets {
  display: flex; align-items: flex-end; gap: 2px; height: 40px;
  padding: 0 8px; background: var(--onglets); overflow-x: auto;
  scrollbar-width: none;
}
.onglets::-webkit-scrollbar { display: none; }
.onglet {
  flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
  height: 32px; padding: 0 16px; min-width: 150px; max-width: 220px;
  border-radius: 9px 9px 0 0; color: var(--texte2); font-size: 13px;
  text-decoration: none; white-space: nowrap;
  transition: background .15s, color .15s;
}
.onglet:hover { background: var(--survol); color: var(--texte); }
.onglet.actif {
  background: var(--onglet-actif); color: var(--texte);
  box-shadow: inset 0 1.5px 0 var(--accent);
}
.onglet svg { flex: none; width: 12px; height: 12px; }
.onglet .fermer { margin-left: auto; color: var(--texte3); font-size: 11px; }
.plus { color: var(--texte3); padding: 0 12px 8px; font-size: 16px; }
.boutons-fenetre {
  margin-left: auto; display: flex; gap: 22px; padding: 0 12px 11px;
  color: var(--texte3); font-size: 12px; flex: none;
}

.nav {
  display: flex; align-items: center; gap: 6px; height: 48px;
  padding: 0 10px; background: var(--nav);
  border-bottom: 1px solid #22212a;
}
.glyphe {
  width: 30px; height: 28px; display: grid; place-items: center;
  color: var(--texte2); border-radius: 8px; font-size: 14px;
}
.adresse {
  flex: 1; display: flex; align-items: center; gap: 10px; height: 30px;
  margin: 0 6px; padding: 0 14px; border-radius: 999px;
  background: var(--champ); color: var(--texte2); font-size: 13px;
  overflow: hidden; white-space: nowrap;
}
.adresse svg { flex: none; }
.adresse .etoile { margin-left: auto; color: var(--texte3); }
.roue {
  width: 34px; height: 30px; border: 0; border-radius: 8px; cursor: pointer;
  display: grid; place-items: center; background: none; color: var(--texte2);
}
.roue:hover, .roue[aria-expanded="true"] { background: var(--survol); color: var(--texte); }
.roue svg { width: 18px; height: 18px; }

/* Le panneau des parametres, celui de l'application, avec la langue dedans */
.panneau {
  position: absolute; right: 10px; top: 92px; width: 300px;
  background: var(--nav); border: 1px solid var(--bord); border-radius: 12px;
  padding: 8px; box-shadow: 0 18px 50px -12px rgba(0, 0, 0, .8);
  opacity: 0; transform: translateY(-6px); pointer-events: none;
  transition: opacity .16s, transform .16s;
}
.panneau.ouvert { opacity: 1; transform: none; pointer-events: auto; }
.panneau .titre {
  display: flex; align-items: center; gap: 10px; padding: 6px 10px 10px;
  font-size: 13px;
}
.ligne {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-radius: 8px; font-size: 13px;
  color: var(--texte2);
}
.pastilles { display: flex; gap: 4px; }
.pastilles button {
  font: inherit; font-size: 11px; font-weight: 600; width: 38px; height: 24px;
  border: 0; border-radius: 8px; cursor: pointer;
  background: var(--champ); color: var(--texte3);
}
.pastilles button[aria-pressed="true"] { background: var(--accent); color: #fff; }

/* --- La page ------------------------------------------------------------ */
main { max-width: 980px; margin: 0 auto; padding: 0 24px 80px; }
section { padding-top: 72px; }

/* L'ouverture reprend la page d'accueil de Plume : le nom, le point violet,
   et le champ en pilule, qui devient ici le bouton de telechargement. */
.accueil {
  min-height: calc(100vh - 88px); display: flex; flex-direction: column;
  align-items: center; justify-content: center; text-align: center;
  position: relative; padding-top: 0; overflow-x: clip;
}
.halo {
  position: absolute; width: 520px; height: 520px; top: 50%; left: 50%;
  margin: -330px 0 0 -260px; pointer-events: none; z-index: -1;
  background: radial-gradient(circle, rgba(124, 92, 255, .26) 0%,
              rgba(124, 92, 255, .08) 40%, rgba(124, 92, 255, 0) 68%);
  animation: respire 5.2s ease-in-out infinite;
}
@keyframes respire {
  0%, 100% { transform: scale(1); opacity: .75; }
  50% { transform: scale(1.12); opacity: 1; }
}
.accueil h1 {
  font-size: clamp(56px, 11vw, 104px); font-weight: 600; margin: 0;
  letter-spacing: -3px; line-height: 1;
}
.accueil h1 span { color: var(--accent-pale); }
.accroche {
  max-width: 34em; margin: 22px auto 34px; color: var(--texte2);
  font-size: 19px; line-height: 1.55;
}
.telecharger {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: min(520px, 100%); height: 56px; border-radius: 999px;
  background: var(--accent); color: #fff; text-decoration: none;
  font-size: 17px; font-weight: 600;
  box-shadow: 0 10px 40px -10px rgba(124, 92, 255, .9);
  transition: transform .12s, box-shadow .2s, background .2s;
}
.telecharger:hover {
  background: #8f74ff; transform: translateY(-1px);
  box-shadow: 0 14px 46px -10px rgba(124, 92, 255, 1);
}
.sous { margin-top: 14px; color: var(--texte3); font-size: 13px; }
/* Dans le flux, pas en bas de l'ecran : sur un ecran bas, place en
   absolu, il chevauchait la ligne sous le bouton. */
.defiler {
  margin-top: 44px; color: var(--texte3); font-size: 12px;
  text-decoration: none; letter-spacing: .08em; text-transform: uppercase;
}
.defiler:hover { color: var(--texte2); }

.etiquette {
  display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .12em;
  text-transform: uppercase; color: var(--accent-pale); margin-bottom: 10px;
}
h2 {
  font-size: clamp(28px, 4.4vw, 40px); margin: 0 0 14px; letter-spacing: -1px;
  line-height: 1.15; font-weight: 600;
}
.chapeau { color: var(--texte2); font-size: 17px; max-width: 42em; margin: 0 0 28px; }

/* La capture, dans une fenetre aux couleurs de Plume */
.capture {
  position: relative; border-radius: 14px; overflow: hidden;
  border: 1px solid var(--bord); background: #1f1f1f;
  box-shadow: 0 40px 90px -40px rgba(0, 0, 0, .95),
              0 0 0 1px rgba(124, 92, 255, .14);
}
.capture img { display: block; width: 100%; height: auto; }
/* La ligne de Plume, surlignee. Ses bornes sont mesurees sur la capture. */
.capture .surligne {
  position: absolute; left: 0; right: 0;
  top: var(--haut, 85.4%); height: var(--hauteur, 11%);
  border: 1.5px solid var(--accent-pale); border-radius: 6px;
  box-shadow: 0 0 0 9999px rgba(18, 19, 26, .38),
              0 0 24px rgba(167, 139, 250, .55);
  pointer-events: none;
}
.chiffres {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px;
}
.fiche {
  background: var(--nav); border: 1px solid var(--bord); border-radius: 12px;
  padding: 16px 18px;
}
.fiche.plume { border-color: rgba(167, 139, 250, .6); }
.fiche .nom { display: flex; align-items: center; gap: 9px; font-weight: 600; }
.fiche .ligne { padding: 8px 0 0; }
.fiche .valeur { color: var(--texte); font-weight: 600; font-variant-numeric: tabular-nums; }
.fiche.plume .valeur { color: var(--accent-pale); }
.legende { color: var(--texte3); font-size: 13px; margin-top: 12px; }
.suite { margin-top: 44px; }
.suite h3 { font-size: 20px; margin: 0 0 8px; font-weight: 600; }
.suite .chapeau { font-size: 15px; margin-bottom: 18px; }

/* Les fonctions, en cartes comme les groupes de travail de l'accueil */
.cartes {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}
.carte {
  background: var(--onglets); border: 1px solid var(--bord); border-radius: 14px;
  padding: 20px 20px 18px; transition: border-color .2s, transform .2s;
}
.carte:hover { border-color: var(--c); transform: translateY(-2px); }
.carte .tete { display: flex; align-items: center; gap: 11px; margin-bottom: 8px; }
.pastille {
  width: 14px; height: 14px; border-radius: 50%; flex: none;
  background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 22%, transparent);
}
.carte h3 { margin: 0; font-size: 17px; font-weight: 600; }
.carte p { margin: 0; color: var(--texte2); font-size: 15px; }

/* L'avertissement de Windows, en bandeau comme ceux de l'application */
.bandeau {
  background: #241d12; border: 1px solid #5c4820; border-radius: 14px;
  padding: 24px 26px;
}
.bandeau h3 { margin: 20px 0 4px; font-size: 16px; }
.bandeau p { margin: 0 0 12px; color: #e4d9c4; }
.empreinte {
  display: block; background: #1a150d; border: 1px solid #4a3a1b;
  border-radius: 10px; padding: 12px 14px; overflow-x: auto; white-space: pre;
  color: #d8c9a8; font: 13px/1.7 ui-monospace, "Cascadia Mono", Consolas, monospace;
  margin: 8px 0 14px;
}

.prive {
  display: flex; gap: 18px; align-items: flex-start;
  background: var(--onglets); border: 1px solid var(--bord); border-radius: 14px;
  padding: 22px 24px;
}
.prive svg { flex: none; margin-top: 4px; }
.prive p { margin: 0; color: var(--texte2); }

footer {
  max-width: 980px; margin: 0 auto; padding: 26px 24px 40px;
  border-top: 1px solid var(--bord); color: var(--texte3); font-size: 13px;
}

/* Les sections montent a l'approche ; visibles sans JavaScript. */
.js .monte { opacity: 0; transform: translateY(22px);
  transition: opacity .6s ease-out, transform .6s cubic-bezier(.22, .61, .36, 1); }
.js .monte.vu { opacity: 1; transform: none; }

@media (max-width: 640px) {
  .boutons-fenetre, .glyphe.secondaire { display: none; }
  .onglet { min-width: 120px; }
  .chiffres { grid-template-columns: 1fr; }
  .panneau { right: 8px; left: 8px; width: auto; }
  section { padding-top: 56px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .halo { animation: none; }
  #page, .panneau, .carte { transition: none; }
  .js .monte { opacity: 1; transform: none; transition: none; }
}
</style>
</head>

<div id="page">

<script>
// --- La roue dentee, la meme que dans la barre de Plume -------------------
// Sept dents, un trou au centre : trace a la main, comme dans l'application.
(function () {
  var dents = 7, r = 9, creux = r * 0.74, periode = 2 * Math.PI / dents;
  var sommet = periode * 0.30, fond = periode * 0.34;
  var flanc = (periode - sommet - fond) / 2, pts = [];
  for (var i = 0; i < dents; i++) {
    var a = -Math.PI / 2 + i * periode;
    [[a, r], [a + sommet, r], [a + sommet + flanc, creux],
     [a + sommet + flanc + fond, creux]].forEach(function (p) {
      pts.push((Math.cos(p[0]) * p[1]).toFixed(2) + "," + (Math.sin(p[0]) * p[1]).toFixed(2));
    });
  }
  var t = r * 0.36;
  var d = "M" + pts.join(" L") + " Z M" + t + ",0 A" + t + "," + t + " 0 1,0 -" + t
        + ",0 A" + t + "," + t + " 0 1,0 " + t + ",0 Z";
  var chemins = document.querySelectorAll("#dent, .dent");
  for (var j = 0; j < chemins.length; j++) { chemins[j].setAttribute("d", d); }
})();

var manifeste = null;
var langue = "fr";

function appliquer(code) {
  langue = TEXTES[code] ? code : "en";
  var t = TEXTES[langue];
  document.documentElement.lang = langue;
  document.title = t.titre;
  var noeuds = document.querySelectorAll("[data-t]");
  for (var i = 0; i < noeuds.length; i++) {
    var cle = noeuds[i].getAttribute("data-t");
    if (typeof t[cle] === "string") { noeuds[i].textContent = t[cle]; }
  }
  var alts = document.querySelectorAll("[data-t-alt]");
  for (var k = 0; k < alts.length; k++) {
    alts[k].alt = t[alts[k].getAttribute("data-t-alt")] || "";
  }
  var arias = document.querySelectorAll("[data-t-aria]");
  for (var m = 0; m < arias.length; m++) {
    arias[m].setAttribute("aria-label", t[arias[m].getAttribute("data-t-aria")] || "");
  }
  var boutons = document.querySelectorAll(".pastilles button");
  for (var j = 0; j < boutons.length; j++) {
    boutons[j].setAttribute("aria-pressed",
      boutons[j].getAttribute("data-langue") === langue ? "true" : "false");
  }
  remplir();
}

// Le manifeste alimente la page : numero de version, adresse de
// telechargement, taille et empreinte viennent d'une seule source.
function remplir() {
  var t = TEXTES[langue];
  document.getElementById("taille").textContent =
    manifeste && manifeste.taille_mo ? t.taille(manifeste.taille_mo) : t.taille_defaut;
  if (!manifeste) { return; }
  if (manifeste.url) {
    document.getElementById("lien-telechargement").href = manifeste.url;
  }
  if (manifeste.sha256) {
    var nom = manifeste.url ? manifeste.url.split("/").pop() : "Plume-installeur.exe";
    document.getElementById("empreinte").textContent =
      "Get-FileHash .\\" + nom + " -Algorithm SHA256\n\n" + manifeste.sha256;
  }
  if (manifeste.version) {
    document.getElementById("version").textContent =
      t.version(manifeste.version, manifeste.date);
  }
}

(function () {
  var choisie = null;
  try { choisie = sessionStorage.getItem("langue"); } catch (e) {}
  if (!choisie) {
    var nav = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
    choisie = /^fr\b/i.test(nav) ? "fr" : "en";
  }
  appliquer(choisie);

  var boutons = document.querySelectorAll(".pastilles button");
  for (var i = 0; i < boutons.length; i++) {
    boutons[i].addEventListener("click", function () {
      var code = this.getAttribute("data-langue");
      try { sessionStorage.setItem("langue", code); } catch (e) {}
      appliquer(code);
    });
  }

  // La roue ouvre le panneau ; un clic ailleurs ou Echap le referme, comme
  // dans l'application.
  var roue = document.querySelector(".roue");
  var panneau = document.getElementById("panneau");
  function ouvrir(oui) {
    panneau.classList.toggle("ouvert", oui);
    roue.setAttribute("aria-expanded", oui ? "true" : "false");
  }
  roue.addEventListener("click", function (e) {
    e.stopPropagation();
    ouvrir(!panneau.classList.contains("ouvert"));
  });
  panneau.addEventListener("click", function (e) { e.stopPropagation(); });
  document.addEventListener("click", function () { ouvrir(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") { ouvrir(false); }
  });
})();

fetch("version.json", { cache: "no-store" })
  .then(function (r) { return r.json(); })
  .then(function (m) { manifeste = m; remplir(); })
  .catch(function () { /* la page reste lisible sans le manifeste */ });

// --- Les onglets suivent la lecture ---------------------------------------
// L'onglet actif est celui de la section qu'on lit, comme dans Plume celui de
// la page qu'on regarde.
(function () {
  var onglets = document.querySelectorAll(".onglet[data-section]");
  if (!window.IntersectionObserver) { return; }
  var guetteur = new IntersectionObserver(function (entrees) {
    entrees.forEach(function (e) {
      if (!e.isIntersecting) { return; }
      for (var i = 0; i < onglets.length; i++) {
        onglets[i].classList.toggle("actif",
          onglets[i].getAttribute("data-section") === e.target.id);
      }
    });
  }, { rootMargin: "-45% 0px -50% 0px" });
  ["accueil", "preuve", "fonctions", "installer"].forEach(function (id) {
    var s = document.getElementById(id);
    if (s) { guetteur.observe(s); }
  });
})();

// --- Les sections montent a l'approche -------------------------------------
(function () {
  var doux = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (doux || !window.IntersectionObserver) { return; }
  document.documentElement.className += " js";
  var guetteur = new IntersectionObserver(function (entrees) {
    entrees.forEach(function (e) {
      if (e.isIntersecting) { e.target.classList.add("vu"); guetteur.unobserve(e.target); }
    });
  }, { rootMargin: "0px 0px -10% 0px" });
  var montants = document.querySelectorAll(".monte");
  for (var j = 0; j < montants.length; j++) { guetteur.observe(montants[j]); }
})();

// --- L'intro, jouee a l'arrivee seulement -----------------------------------
(function () {
  var toile = document.getElementById("intro");
  var page = document.getElementById("page");
  function reveler() {
    toile.classList.add("partie");
    page.classList.add("visible");
    document.body.classList.remove("attend");
    setTimeout(function () { toile.remove(); }, 400);
  }
  var dejaVue = false;
  try { dejaVue = sessionStorage.getItem("intro-vue") === "1"; } catch (e) {}
  if (dejaVue || !window.IntroPlume) { reveler(); return; }
  try { sessionStorage.setItem("intro-vue", "1"); } catch (e) {}
  window.IntroPlume.jouer(toile, reveler);
})();
