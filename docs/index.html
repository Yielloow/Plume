<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plume, a browser that plays video with mpv</title>
<meta name="description" content="A light browser that replaces each site's video player with mpv: less memory, no ads, and the picture stays in the page.">
<link rel="icon" href="plume.ico">
<meta property="og:title" content="Plume">
<meta property="og:description" content="A browser that plays video with mpv instead of the site's own player.">
<style>
:root {
  --fond: #12131a;
  --fond2: #1a1b26;
  --bord: #2b2c3a;
  --texte: #fbfbfe;
  --texte2: #a39bbd;
  --accent: #7c5cff;
  --accent-pale: #a78bfa;
  --avert-fond: #241d12;
  --avert-bord: #5c4820;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--fond);
  color: var(--texte);
  font: 16px/1.65 -apple-system, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* --- L'intro, la meme que celle du navigateur au lancement --------------- */
#intro {
  position: fixed; inset: 0; z-index: 100;
  width: 100%; height: 100%; display: block;
  background: #12131a; cursor: pointer;
}
#intro.partie { opacity: 0; pointer-events: none; transition: opacity .28s; }
/* La page arrive derriere la toile qui s'ecarte, elle ne la remplace pas. */
#page { opacity: 0; transition: opacity .5s ease-out; }
#page.visible { opacity: 1; }
body.attend { overflow: hidden; }

.enveloppe {
  max-width: 780px; margin: 0 auto; padding: 0 24px 96px; position: relative;
}

header { padding: 84px 0 44px; }
.logotype { display: flex; align-items: center; gap: 18px; margin-bottom: 18px; }
.logotype svg { width: 46px; height: 46px; flex: none; }
h1 {
  font-size: 62px; margin: 0; letter-spacing: -2px; font-weight: 600;
  line-height: 1;
}
h1 .point { color: var(--accent-pale); }
.accroche {
  font-size: 21px; color: var(--texte2); margin: 0 0 36px; max-width: 33em;
  line-height: 1.5;
}
h2 { font-size: 23px; margin: 56px 0 14px; letter-spacing: -0.4px; }
h3 { font-size: 17px; margin: 26px 0 6px; }
p { margin: 0 0 14px; }
a { color: var(--accent-pale); }

.bouton {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--accent); color: #fff; text-decoration: none;
  padding: 15px 30px; border-radius: 11px; font-weight: 600; font-size: 17px;
  box-shadow: 0 6px 30px -8px rgba(124, 92, 255, .8);
  transition: transform .12s, box-shadow .2s, background .2s;
}
.bouton:hover {
  background: #8f74ff; transform: translateY(-1px);
  box-shadow: 0 10px 38px -8px rgba(124, 92, 255, .95);
}
.sous-bouton { color: var(--texte2); font-size: 14px; margin-top: 14px; }

/* --- Le relief, sans moteur 3D ----------------------------------------- */

/* Le halo derriere le titre respire, comme l'etincelle de l'intro respire
   pendant que le navigateur se prepare. Meme periode, meme intention : dire
   que quelque chose vit. */
header { position: relative; }
.halo {
  position: absolute; left: -80px; top: 10px; width: 380px; height: 380px;
  pointer-events: none; z-index: -1;
  background: radial-gradient(circle,
              rgba(124, 92, 255, .30) 0%,
              rgba(124, 92, 255, .10) 38%,
              rgba(124, 92, 255, 0) 68%);
  animation: respire 5.2s ease-in-out infinite;
}
@keyframes respire {
  0%, 100% { transform: scale(1);    opacity: .75; }
  50%      { transform: scale(1.14); opacity: 1; }
}

/* La parallaxe : quelques degres, pas plus. Au dela, l'etincelle se decolle
   du titre et le logotype cesse d'etre un bloc. */
.logotype svg {
  transition: transform .25s cubic-bezier(.22, .61, .36, 1);
  will-change: transform;
}

/* Les sections montent a l'approche. Elles sont visibles par defaut : si le
   JavaScript ne tourne pas, rien ne disparait. */
.monte { opacity: 1; transform: none; }
.js .monte {
  opacity: 0; transform: translateY(22px);
  transition: opacity .6s ease-out, transform .6s cubic-bezier(.22, .61, .36, 1);
}
.js .monte.vu { opacity: 1; transform: none; }

/* La carte du navigateur : du vrai relief, en perspective CSS. Elle se
   redresse au survol, ce qui donne le volume sans qu'aucune image ne soit
   chargee : tout est dessine par le navigateur qui l'affiche. */
.scene { perspective: 1400px; margin: 40px 0 8px; }
.carte {
  transform: rotateX(9deg) rotateY(-7deg) rotateZ(.6deg);
  transform-style: preserve-3d;
  transition: transform .5s cubic-bezier(.22, .61, .36, 1),
              box-shadow .5s ease-out;
  border-radius: 12px; overflow: hidden;
  border: 1px solid var(--bord); background: #12131a;
  box-shadow: 0 30px 70px -30px rgba(0, 0, 0, .9),
              0 0 0 1px rgba(124, 92, 255, .12);
}
.scene:hover .carte {
  transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) translateY(-4px);
  box-shadow: 0 40px 90px -34px rgba(0, 0, 0, .95),
              0 0 0 1px rgba(124, 92, 255, .35);
}
.carte .barre-onglets {
  display: flex; gap: 4px; padding: 6px 8px 0; background: #1c1b22;
}
.carte .onglet {
  font-size: 11px; color: #8f8f9e; padding: 7px 14px 8px;
  border-radius: 8px 8px 0 0; white-space: nowrap;
}
.carte .onglet.actif {
  color: #fbfbfe; background: #40395c;
  box-shadow: inset 0 1px 0 #7c5cff, inset 1px 0 0 #7c5cff,
              inset -1px 0 0 #7c5cff;
}
.carte .barre-adresse {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; background: #2b2a33;
}
.carte .pilule {
  flex: 1; font-size: 11px; color: #a39bbd; background: #1c1b22;
  border-radius: 999px; padding: 5px 12px;
}
.carte .video {
  position: relative; aspect-ratio: 16 / 9;
  background: linear-gradient(150deg, #241f3d 0%, #14131c 60%, #1d1830 100%);
}
.carte .lecteur {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 10px 12px 12px;
  background: linear-gradient(transparent, rgba(0, 0, 0, .75));
}
.carte .curseur { height: 3px; border-radius: 2px; background: #3a3944; }
.carte .curseur i {
  display: block; height: 100%; width: 38%; border-radius: 2px;
  background: #a78bfa; box-shadow: 0 0 10px rgba(167, 139, 250, .9);
}
.carte .duree {
  margin-top: 8px; font-size: 10px; color: #c9c3dd;
  display: flex; justify-content: space-between;
}
.legende {
  text-align: center; color: var(--texte2); font-size: 13px; margin: 0 0 8px;
}

@media (prefers-reduced-motion: reduce) {
  .halo { animation: none; }
  .carte, .scene:hover .carte { transition: none; transform: none; }
  .logotype svg { transition: none; }
  .js .monte { opacity: 1; transform: none; transition: none; }
}
@media (max-width: 560px) {
  .halo { width: 250px; height: 250px; left: -50px; }
  .carte { transform: none; }
}

/* Le choix de langue : discret, en haut a droite, hors du chemin de lecture. */
.langues {
  position: absolute; top: 26px; right: 24px; display: flex; gap: 2px;
  font-size: 13px;
}
.langues button {
  background: none; border: 1px solid transparent; color: var(--texte2);
  padding: 5px 10px; border-radius: 7px; cursor: pointer; font: inherit;
}
.langues button:hover { color: var(--texte); }
.langues button[aria-pressed="true"] {
  color: var(--texte); border-color: var(--bord); background: var(--fond2);
}

code, .empreinte {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: 13px;
}
code { color: var(--accent-pale); }
.empreinte {
  display: block; background: var(--fond2); border: 1px solid var(--bord);
  border-radius: 9px; padding: 13px 15px; overflow-x: auto;
  color: var(--texte2); white-space: pre; line-height: 1.7;
}
.avertissement {
  background: var(--avert-fond); border: 1px solid var(--avert-bord);
  border-radius: 12px; padding: 20px 24px; margin: 32px 0;
}
.avertissement h2 { margin-top: 0; font-size: 20px; }

.traits { list-style: none; padding: 0; margin: 0; }
.traits li { border-top: 1px solid var(--bord); padding: 16px 0; }
.traits b { display: block; font-weight: 600; margin-bottom: 2px; }
.traits span { color: var(--texte2); }

footer {
  border-top: 1px solid var(--bord); margin-top: 72px; padding-top: 26px;
  color: var(--texte2); font-size: 14px;
}

@media (prefers-color-scheme: light) {
  :root {
    --fond: #fcfbff; --fond2: #f2effa; --bord: #e0daf0;
    --texte: #16121f; --texte2: #5b5273;
    --accent: #6c4fc0; --accent-pale: #553a9e;
    --avert-fond: #fdf7e6; --avert-bord: #e3cf99;
  }
  /* L'intro garde son fond sombre : c'est celui du navigateur, et un
     logotype pale sur fond clair ne serait plus le meme objet. */
}
@media (max-width: 560px) {
  h1 { font-size: 46px; }
  .accroche { font-size: 18px; }
  header { padding: 72px 0 32px; }
  .langues { top: 16px; right: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  #page { transition: none; }
}
</style>
</head>
<body class="attend">

<canvas id="intro" aria-hidden="true"></canvas>

<div id="page">
<div class="enveloppe">

<nav class="langues" aria-label="Language">
  <button type="button" data-langue="en" aria-pressed="true">EN</button>
  <button type="button" data-langue="fr" aria-pressed="false">FR</button>
</nav>

<header>
  <div class="halo" aria-hidden="true"></div>
  <div class="logotype">
    <!-- L'etoile a quatre branches de l'icone, cotes concaves. -->
    <svg viewBox="-1 -1 2 2" aria-hidden="true">
      <path fill="#a78bfa"
            d="M0,-1 Q0.16,-0.16 1,0 Q0.16,0.16 0,1 Q-0.16,0.16 -1,0 Q-0.16,-0.16 0,-1 Z"/>
    </svg>
    <h1>Plume<span class="point">.</span></h1>
  </div>
  <p class="accroche" data-t="accroche"></p>
  <a class="bouton" id="lien-telechargement" data-t="telecharger"
     href="https://github.com/Yielloow/Plume/releases/latest"></a>
  <p class="sous-bouton"><span data-t="exigences"></span>
  <span id="taille"></span> <span data-t="rien-installer"></span></p>
</header>

<div class="scene" aria-hidden="true">
  <div class="carte">
    <div class="barre-onglets">
      <div class="onglet actif">YouTube</div>
      <div class="onglet">Twitch</div>
      <div class="onglet">+</div>
    </div>
    <div class="barre-adresse">
      <svg width="13" height="13" viewBox="-1 -1 2 2">
        <path fill="#a78bfa"
              d="M0,-1 Q0.16,-0.16 1,0 Q0.16,0.16 0,1 Q-0.16,0.16 -1,0 Q-0.16,-0.16 0,-1 Z"/>
      </svg>
      <div class="pilule">youtube.com/watch</div>
    </div>
    <div class="video">
      <div class="lecteur">
        <div class="curseur"><i></i></div>
        <div class="duree"><span>12:04</span><span>31:47</span></div>

  </div>
</div>
<p class="legende" data-t="legende"></p>

<div class="avertissement monte">
  <h2 data-t="avert-titre"></h2>
  <p data-t="avert-intro"></p>

  <h3 data-t="avert-bleu-titre"></h3>
  <p data-t="avert-bleu"></p>

  <h3 data-t="avert-rouge-titre"></h3>
  <p data-t="avert-rouge"></p>
  <p data-t="avert-verifier"></p>
  <code class="empreinte" id="empreinte"></code>
  <p data-t="avert-conclusion"></p>
  <p data-t="avert-exclusion"></p>
</div>

<h2 data-t="traits-titre" class="monte"></h2>
<ul class="traits monte">
  <li><b data-t="t1"></b><span data-t="t1d"></span></li>
  <li><b data-t="t2"></b><span data-t="t2d"></span></li>
  <li><b data-t="t3"></b><span data-t="t3d"></span></li>
  <li><b data-t="t4"></b><span data-t="t4d"></span></li>
  <li><b data-t="t5"></b><span data-t="t5d"></span></li>
  <li><b data-t="t6"></b><span data-t="t6d"></span></li>
</ul>

<h2 data-t="vie-privee-titre" class="monte"></h2>
<p data-t="vie-privee" class="monte"></p>

<footer>
  <p><span data-t="pied"></span> <span id="version"></span></p>
</footer>

</div>
</div>

<script src="intro.js"></script>
<script>
// --- Les deux langues -----------------------------------------------------
// L'anglais par defaut, le francais si le navigateur est en francais. Le choix
// manuel l'emporte sur la detection et tient le temps de la session : quelqu'un
// dont le navigateur est en anglais mais qui prefere lire en francais ne doit
// pas avoir a le redemander a chaque page.
var TEXTES = {
  en: {
    titre: "Plume, a browser that plays video with mpv",
    accroche: "A browser that plays video with mpv instead of the site's own player: less memory, no ads, and the picture stays right where it was in the page.",
    telecharger: "Download for Windows",
    exigences: "Windows 10 (1809) or 11 ·",
    "rien-installer": "nothing else to install",
    "avert-titre": "Windows will complain. That is expected, and here is why",
    "avert-intro": "Plume is not signed by any certificate. A code signing certificate costs several hundred euros a year, and Plume is a free project made for a handful of people. So Windows does not know its publisher, and says so.",
    "avert-bleu-titre": "Blue window, “Windows protected your PC”",
    "avert-bleu": "That is a reputation warning, not a detection. Click More info, then Run anyway.",
    "avert-rouge-titre": "Red alert about a trojan",
    "avert-rouge": "Often named Wacatac or Bearfoos, ending in !ml. This is a known false positive on compiled Python programs, and the !ml suffix means precisely that the verdict comes from a heuristic rather than a signature.",
    "avert-verifier": "Do not take our word for it. First check that the file you received is the one that was published, by comparing its hash with this one:",
    "avert-conclusion": "If it matches, the file was not altered on the way. If it does not, run nothing.",
    "avert-exclusion": "Do not add a permanent antivirus exclusion to silence the alert: turning protections off is a habit that forms quickly, and it is the wrong one to pick up.",
    "traits-titre": "What Plume does",
    t1: "mpv instead of the site's player",
    t1d: "The picture stays exactly where it was in the page, but mpv does the decoding: far less memory, and no video ads.",
    t2: "Your videos resume where you left them",
    t2d: "Close in the middle of a video: when you reopen it, it starts again at the right place, without asking.",
    t3: "Tabs you are not watching go to sleep",
    t3d: "They give their memory back, and coming back to one finds it intact, half-filled form included.",
    t4: "Work groups",
    t4d: "Right-click a tab to file it into a group; one click on the home page reopens the whole group.",
    t5: "A private window",
    t5d: "No history, no cookies, no tabs kept. When it closes, everything goes.",
    t6: "Everything is included",
    t6d: "Python, mpv, Deno and yt-dlp are in the package. The only prerequisite, shipped with Windows 11: the WebView2 runtime.",
    "vie-privee-titre": "Privacy",
    "vie-privee": "Plume sends nothing anywhere. History, bookmarks, cookies and playback positions are files in the profil/ subfolder, on your own machine; deleting them is enough to forget everything. The only request Plume makes on its own is a version check, once a day, to this page, and it stops entirely if you empty manifeste_maj in config.json.",
    legende: "The picture stays in the page. mpv does the decoding.",
    pied: "Plume is a personal project, distributed as is, without warranty.",
    version: function (v, d) { return "Version " + v + (d ? ", " + d : "") + "."; },
    taille: function (mo) { return mo + " MB ·"; },
    taille_defaut: "about 120 MB ·"
  },
  fr: {
    titre: "Plume, un navigateur qui joue les vidéos avec mpv",
    accroche: "Un navigateur qui joue les vidéos avec mpv au lieu du lecteur du site : moins de mémoire, pas de publicité, et l'image reste là où elle était dans la page.",
    telecharger: "Télécharger pour Windows",
    exigences: "Windows 10 (1809) ou 11 ·",
    "rien-installer": "rien à installer en plus",
    "avert-titre": "Windows va se plaindre. C'est normal, et voici pourquoi",
    "avert-intro": "Plume n'est signée par aucun certificat. Un certificat de signature coûte plusieurs centaines d'euros par an, et Plume est un projet gratuit fait pour quelques personnes. Windows ne connaît donc pas son éditeur, et le dit.",
    "avert-bleu-titre": "Fenêtre bleue, « Windows a protégé votre ordinateur »",
    "avert-bleu": "C'est un avertissement de réputation, pas une détection. Cliquer sur Informations complémentaires, puis Exécuter quand même.",
    "avert-rouge-titre": "Alerte rouge parlant d'un cheval de Troie",
    "avert-rouge": "Souvent nommé Wacatac ou Bearfoos, avec !ml à la fin. C'est un faux positif connu des programmes Python compilés, et le !ml signifie justement que le verdict vient d'une heuristique et non d'une signature.",
    "avert-verifier": "Ne passez pas outre sur parole. Vérifiez que le fichier reçu est bien celui qui a été publié, en comparant son empreinte à celle-ci :",
    "avert-conclusion": "Si elle correspond, le fichier n'a pas été altéré en chemin. Sinon, ne lancez rien.",
    "avert-exclusion": "N'ajoutez pas d'exclusion antivirus permanente pour faire taire l'alerte : on prend vite l'habitude de désactiver des protections, et c'est le réflexe qu'il vaut mieux ne pas acquérir.",
    "traits-titre": "Ce que Plume fait",
    t1: "mpv à la place du lecteur du site",
    t1d: "L'image reste exactement où elle était dans la page, mais c'est mpv qui décode : nettement moins de mémoire, et aucune publicité vidéo.",
    t2: "Vos vidéos reprennent où vous les avez laissées",
    t2d: "Fermez au milieu d'une vidéo : en rouvrant, elle repart au bon endroit, sans rien vous demander.",
    t3: "Les onglets que vous ne regardez pas se mettent en veille",
    t3d: "Ils rendent la mémoire, et y revenir les retrouve intacts, formulaire à moitié rempli compris.",
    t4: "Des groupes de travail",
    t4d: "Clic droit sur un onglet pour le ranger dans un groupe ; un clic sur la page d'accueil rouvre tout le groupe.",
    t5: "Une fenêtre privée",
    t5d: "Ni historique, ni cookies, ni onglets gardés. À la fermeture, tout part.",
    t6: "Tout est inclus",
    t6d: "Python, mpv, Deno et yt-dlp sont dans le paquet. Seul prérequis, présent d'origine sur Windows 11 : le runtime WebView2.",
    "vie-privee-titre": "Vie privée",
    "vie-privee": "Plume ne renvoie rien nulle part. L'historique, les favoris, les cookies et les positions de lecture sont des fichiers dans le sous-dossier profil/, sur votre machine ; les supprimer suffit à tout oublier. La seule requête que Plume émet d'elle-même est une vérification de version, une fois par jour, vers cette page, et elle se coupe en vidant manifeste_maj dans config.json.",
    legende: "L'image reste dans la page. C'est mpv qui la décode.",
    pied: "Plume est un projet personnel, distribué tel quel, sans garantie.",
    version: function (v, d) { return "Version " + v + (d ? ", " + d : "") + "."; },
    taille: function (mo) { return mo + " Mo ·"; },
    taille_defaut: "environ 120 Mo ·"
  }
};

var manifeste = null;
var langue = "en";

function appliquer(code) {
  langue = TEXTES[code] ? code : "en";
  var t = TEXTES[langue];
  document.documentElement.lang = langue;
  document.title = t.titre;
  var noeuds = document.querySelectorAll("[data-t]");
  for (var i = 0; i < noeuds.length; i++) {
    var cle = noeuds[i].getAttribute("data-t");
    if (typeof t[cle] === "string") { noeuds[i].textContent = t[cle]; }
  }
  var boutons = document.querySelectorAll(".langues button");
  for (var j = 0; j < boutons.length; j++) {
    boutons[j].setAttribute("aria-pressed",
      boutons[j].getAttribute("data-langue") === langue ? "true" : "false");
  }
  remplir();
}

// Le manifeste alimente la page : une seule source pour le numero de version,
// l'adresse de telechargement, la taille et l'empreinte. Publier une version
// sans mettre la page a jour devient donc impossible a rater.
function remplir() {
  var t = TEXTES[langue];
  document.getElementById("taille").textContent =
    manifeste && manifeste.taille_mo
      ? t.taille(manifeste.taille_mo) : t.taille_defaut;
  if (!manifeste) { return; }
  if (manifeste.url) {
    document.getElementById("lien-telechargement").href = manifeste.url;
  }
  if (manifeste.sha256) {
    var nom = manifeste.url
      ? manifeste.url.split("/").pop() : "Plume-installeur.exe";
    document.getElementById("empreinte").textContent =
      "Get-FileHash .\\" + nom + " -Algorithm SHA256\n\n" + manifeste.sha256;
  }
  if (manifeste.version) {
    document.getElementById("version").textContent =
      t.version(manifeste.version, manifeste.date);
  }
}

(function () {
  var choisie = null;
  try { choisie = sessionStorage.getItem("langue"); } catch (e) {}
  if (!choisie) {
    var nav = (navigator.languages && navigator.languages[0])
      || navigator.language || "en";
    choisie = /^fr\b/i.test(nav) ? "fr" : "en";
  }
  appliquer(choisie);

  var boutons = document.querySelectorAll(".langues button");
  for (var i = 0; i < boutons.length; i++) {
    boutons[i].addEventListener("click", function () {
      var code = this.getAttribute("data-langue");
      try { sessionStorage.setItem("langue", code); } catch (e) {}
      appliquer(code);
    });
  }
})();

fetch("version.json", { cache: "no-store" })
  .then(function (r) { return r.json(); })
  .then(function (m) { manifeste = m; remplir(); })
  .catch(function () { /* la page reste lisible sans le manifeste */ });

// --- Le relief ------------------------------------------------------------
// La classe est posee par le script : sans JavaScript, les sections restent
// visibles au lieu de disparaitre en attendant une animation qui ne viendra
// pas.
(function () {
  var doux = window.matchMedia
    && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (doux) { return; }
  document.documentElement.className += " js";

  // Les sections montent quand elles approchent du bas de la fenetre.
  if (window.IntersectionObserver) {
    var guetteur = new IntersectionObserver(function (entrees) {
      for (var i = 0; i < entrees.length; i++) {
        if (entrees[i].isIntersecting) {
          entrees[i].target.classList.add("vu");
          guetteur.unobserve(entrees[i].target);
        }
      }
    }, { rootMargin: "0px 0px -12% 0px" });
    var montants = document.querySelectorAll(".monte");
    for (var j = 0; j < montants.length; j++) { guetteur.observe(montants[j]); }
  } else {
    // Navigateur sans guetteur : on montre tout, plutot que rien.
    document.documentElement.className =
      document.documentElement.className.replace(" js", "");
  }

  // Parallaxe : quelques degres sur l'etincelle, suivant la souris. Bornee,
  // et seulement sur un pointeur fin : sur un ecran tactile elle n'aurait
  // aucun sens, et le survol y reste colle apres le doigt.
  var etoile = document.querySelector(".logotype svg");
  var fin = window.matchMedia && window.matchMedia("(pointer: fine)").matches;
  if (etoile && fin) {
    var enAttente = false;
    window.addEventListener("mousemove", function (e) {
      if (enAttente) { return; }
      enAttente = true;
      window.requestAnimationFrame(function () {
        enAttente = false;
        var dx = (e.clientX / window.innerWidth - 0.5) * 2;
        var dy = (e.clientY / window.innerHeight - 0.5) * 2;
        etoile.style.transform =
          "perspective(600px) rotateY(" + (dx * 9).toFixed(2) + "deg)"
          + " rotateX(" + (-dy * 9).toFixed(2) + "deg)"
          + " translate(" + (dx * 5).toFixed(1) + "px,"
          + (dy * 4).toFixed(1) + "px)";
      });
    });
  }
})();

// --- L'intro --------------------------------------------------------------
// Elle ne se joue qu'a l'arrivee. Revenir en arriere, ou recharger pour relire
// un paragraphe, ne doit pas reimposer deux secondes et demie : une intro
// qu'on subit deux fois devient une porte a pousser.
(function () {
  var toile = document.getElementById("intro");
  var page = document.getElementById("page");

  function reveler() {
    toile.classList.add("partie");
    page.classList.add("visible");
    document.body.classList.remove("attend");
    setTimeout(function () { toile.remove(); }, 400);
  }

  var dejaVue = false;
  try { dejaVue = sessionStorage.getItem("intro-vue") === "1"; } catch (e) {}
  if (dejaVue || !window.IntroPlume) { reveler(); return; }
  try { sessionStorage.setItem("intro-vue", "1"); } catch (e) {}
  window.IntroPlume.jouer(toile, reveler);
})();
</script>
